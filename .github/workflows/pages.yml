name: Publish Qingfeng frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare frontend only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html site-config.json .nojekyll _site/
          cp -R assets _site/assets
          test -z "$(find _site -type f \( -name '*.py' -o -name '*.key' -o -name '*.pem' -o -name '.env*' \) -print)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
